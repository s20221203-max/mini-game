<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom neon glow effects */
        .glow-text {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .glow-x {
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.6);
        }
        .glow-o {
            text-shadow: 0 0 15px rgba(244, 114, 182, 0.6);
        }
        .glow-ai {
            text-shadow: 0 0 15px rgba(167, 139, 250, 0.6);
        }
        .cell-transition {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Prevent double-tap zoom on mobile */
        button {
            touch-action: manipulation;
        }
        @keyframes pulse-purple {
            0%, 100% { box-shadow: 0 0 5px rgba(167, 139, 250, 0.5); }
            50% { box-shadow: 0 0 20px rgba(167, 139, 250, 0.8); }
        }
        .animate-ai-thinking {
            animation: pulse-purple 2s infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center font-sans selection:bg-cyan-500 selection:text-white py-10">

    <!-- Game Container -->
    <div class="w-full max-w-md px-4 flex flex-col items-center space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent pb-1">
                Tic Tac Toe
            </h1>
            <div id="status" class="text-xl md:text-2xl font-medium text-slate-400 h-8">
                Player <span class="text-cyan-400 font-bold">X</span>'s turn
            </div>
        </div>

        <!-- The Grid -->
        <div class="bg-slate-800 p-4 rounded-2xl shadow-2xl border border-slate-700 relative z-10">
            <div class="grid grid-cols-3 gap-3 md:gap-4" id="board">
                <!-- Cells will be generated by JS -->
            </div>
        </div>

        <!-- AI Controls -->
        <div class="w-full bg-slate-800/50 backdrop-blur-sm border border-purple-500/30 rounded-xl p-4 space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-purple-300 font-bold text-sm uppercase tracking-wider flex items-center gap-2">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2a1 1 0 0 1 1 1v2.17a8.96 8.96 0 0 1 5.83 5.83H21a1 1 0 1 1 0 2h-2.17A8.96 8.96 0 0 1 13 18.83V21a1 1 0 1 1-2 0v-2.17A8.96 8.96 0 0 1 5.17 13H3a1 1 0 1 1 0-2h2.17A8.96 8.96 0 0 1 11 5.17V3a1 1 0 0 1 1-1zm0 4a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
                    Gemini Companion
                </h3>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="askGemini('roast')" id="btn-roast" class="flex items-center justify-center gap-2 px-4 py-2 bg-purple-900/50 hover:bg-purple-800/80 border border-purple-500/50 rounded-lg text-sm font-medium transition-all group">
                    <span>✨ Roast Board</span>
                </button>
                <button onclick="askGemini('hint')" id="btn-hint" class="flex items-center justify-center gap-2 px-4 py-2 bg-indigo-900/50 hover:bg-indigo-800/80 border border-indigo-500/50 rounded-lg text-sm font-medium transition-all group">
                    <span>✨ Get Hint</span>
                </button>
            </div>

            <!-- AI Output Area -->
            <div id="ai-output" class="hidden text-sm text-slate-300 bg-slate-900/80 rounded-lg p-3 border-l-4 border-purple-500 min-h-[3rem] items-center">
                <span id="ai-text">Thinking...</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex space-x-4 pt-2">
            <button onclick="restartGame()" class="group relative px-6 py-3 font-bold text-white rounded-xl bg-slate-700 overflow-hidden transition-all hover:bg-slate-600 active:scale-95 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:ring-offset-2 focus:ring-offset-slate-900">
                <span class="relative z-10 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 transition-transform group-hover:-rotate-180"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"/><path d="M3 3v9h9"/></svg>
                    Restart Game
                </span>
            </button>
        </div>

        <!-- History / Score -->
        <div class="flex justify-between w-full max-w-xs text-sm text-slate-500 px-4">
            <div class="flex flex-col items-center">
                <span class="uppercase tracking-wider text-xs font-semibold">Player X</span>
                <span id="scoreX" class="text-2xl font-bold text-cyan-400">0</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="uppercase tracking-wider text-xs font-semibold">Draws</span>
                <span id="scoreDraw" class="text-2xl font-bold text-slate-300">0</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="uppercase tracking-wider text-xs font-semibold">Player O</span>
                <span id="scoreO" class="text-2xl font-bold text-pink-400">0</span>
            </div>
        </div>

    </div>

    <script>
        // --- Game State ---
        let boardState = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let isGameActive = true;
        let scores = { X: 0, O: 0, Draws: 0 };
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        // --- DOM Elements ---
        const statusDisplay = document.getElementById('status');
        const boardContainer = document.getElementById('board');
        const scoreXEl = document.getElementById('scoreX');
        const scoreOEl = document.getElementById('scoreO');
        const scoreDrawEl = document.getElementById('scoreDraw');
        const aiOutputDiv = document.getElementById('ai-output');
        const aiTextEl = document.getElementById('ai-text');

        // --- Gemini API Setup ---
        const apiKey = ""; // Injected by environment

        async function askGemini(mode) {
            if (!apiKey) {
                showAIResponse("API Key missing. Cannot call Gemini.");
                return;
            }

            // UI Loading State
            aiOutputDiv.classList.remove('hidden');
            aiOutputDiv.classList.add('flex');
            aiTextEl.innerHTML = `<span class="animate-pulse">Gemini is analyzing the board...</span>`;
            
            // Construct Board Representation
            const boardMap = boardState.map((cell, i) => `[${i}: ${cell || 'Empty'}]`).join(', ');
            
            let systemPrompt = "";
            let userPrompt = "";

            if (mode === 'roast') {
                systemPrompt = "You are a hilarious, high-energy esports commentator for Tic-Tac-Toe. You love roasting bad moves and hyping up mediocre ones. Keep it short (max 2 sentences).";
                userPrompt = `Current Board: ${boardMap}. It is ${currentPlayer}'s turn. Game Active: ${isGameActive}. Give a funny commentary or roast about the current state of the game.`;
            } else if (mode === 'hint') {
                systemPrompt = "You are a Grandmaster Tic-Tac-Toe strategist. You provide concise, tactical advice. Suggest the best move (0-8) and explain why in 1 short sentence.";
                userPrompt = `Current Board: ${boardMap}. It is ${currentPlayer}'s turn. Game Active: ${isGameActive}. Valid moves are indices where value is 'Empty'. Suggest the best move index and explain why.`;
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });

                if (!response.ok) throw new Error('API request failed');

                const data = await response.json();
                const aiResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || "I'm speechless!";
                showAIResponse(aiResponse);

            } catch (error) {
                console.error(error);
                showAIResponse("Oops! Gemini got distracted. Try again.");
            }
        }

        function showAIResponse(text) {
            aiOutputDiv.classList.remove('hidden');
            aiOutputDiv.classList.add('flex');
            // Simple markdown cleanup (remove bolding asterisks for cleaner UI)
            aiTextEl.innerText = text.replace(/\*\*/g, '');
        }

        // --- Game Logic ---
        function initGame() {
            boardContainer.innerHTML = '';
            boardState.forEach((cell, index) => {
                const cellElement = document.createElement('button');
                cellElement.classList.add(
                    'w-20', 'h-20', 'md:w-24', 'md:h-24',
                    'bg-slate-900', 'rounded-xl',
                    'text-4xl', 'md:text-5xl', 'font-bold',
                    'flex', 'items-center', 'justify-center',
                    'shadow-inner', 'border-2', 'border-slate-800',
                    'cell-transition', 'hover:border-slate-600', 'hover:bg-slate-800',
                    'focus:outline-none', 'focus:ring-2', 'focus:ring-cyan-500/50'
                );
                cellElement.setAttribute('data-index', index);
                cellElement.addEventListener('click', handleCellClick);
                boardContainer.appendChild(cellElement);
            });
            updateStatus();
            // Hide AI output on restart
            aiOutputDiv.classList.add('hidden');
            aiOutputDiv.classList.remove('flex');
        }

        function handleCellClick(event) {
            const clickedCell = event.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            if (boardState[clickedCellIndex] !== '' || !isGameActive) {
                return;
            }

            handleCellPlayed(clickedCell, clickedCellIndex);
            handleResultValidation();
        }

        function handleCellPlayed(clickedCell, clickedCellIndex) {
            boardState[clickedCellIndex] = currentPlayer;
            clickedCell.innerHTML = currentPlayer;
            
            if (currentPlayer === 'X') {
                clickedCell.classList.add('text-cyan-400', 'glow-x');
            } else {
                clickedCell.classList.add('text-pink-400', 'glow-o');
            }
            
            clickedCell.classList.remove('hover:bg-slate-800', 'hover:border-slate-600');
            clickedCell.classList.add('cursor-default');
        }

        function handleResultValidation() {
            let roundWon = false;
            let winningLine = [];

            for (let i = 0; i <= 7; i++) {
                const winCondition = winningConditions[i];
                let a = boardState[winCondition[0]];
                let b = boardState[winCondition[1]];
                let c = boardState[winCondition[2]];

                if (a === '' || b === '' || c === '') continue;
                if (a === b && b === c) {
                    roundWon = true;
                    winningLine = winCondition;
                    break;
                }
            }

            if (roundWon) {
                highlightWinningCells(winningLine);
                announceWinner(currentPlayer);
                isGameActive = false;
                updateScore(currentPlayer);
                return;
            }

            let roundDraw = !boardState.includes("");
            if (roundDraw) {
                statusDisplay.innerHTML = `<span class="text-slate-100">It's a Draw!</span>`;
                isGameActive = false;
                updateScore('Draws');
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            updateStatus();
        }

        function highlightWinningCells(indices) {
            const cells = document.querySelectorAll('#board button');
            indices.forEach(index => {
                const cell = cells[index];
                cell.classList.remove('bg-slate-900');
                if (currentPlayer === 'X') {
                    cell.classList.add('bg-cyan-900/30', 'border-cyan-500');
                } else {
                    cell.classList.add('bg-pink-900/30', 'border-pink-500');
                }
            });
        }

        function announceWinner(player) {
            const colorClass = player === 'X' ? 'text-cyan-400' : 'text-pink-400';
            statusDisplay.innerHTML = `Player <span class="${colorClass} font-bold glow-text">${player}</span> Wins!`;
        }

        function updateStatus() {
            const colorClass = currentPlayer === 'X' ? 'text-cyan-400' : 'text-pink-400';
            statusDisplay.innerHTML = `Player <span class="${colorClass} font-bold">${currentPlayer}</span>'s turn`;
        }

        function updateScore(winner) {
            if (winner === 'X') scores.X++;
            else if (winner === 'O') scores.O++;
            else scores.Draws++;

            scoreXEl.innerText = scores.X;
            scoreOEl.innerText = scores.O;
            scoreDrawEl.innerText = scores.Draws;
        }

        function restartGame() {
            isGameActive = true;
            currentPlayer = "X";
            boardState = ['', '', '', '', '', '', '', '', ''];
            initGame();
        }

        initGame();
    </script>
</body>
</html>
